services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking_platform
    ports:
      - "5432:5432"
    volumes:
      - booking_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  booking_postgres:
